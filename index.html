<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Revista - Affinity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Cabeçalho -->
    <header class="app-header">
      <div class="header-content">
        <h1 class="logo-title">NextGen Insights <span>• Guia de Produção</span></h1>
        <p class="subtitle">Organização e fluxo de trabalho da revista no Affinity</p>
      </div>
      <div class="header-actions">
        <button id="btnLimparProgresso" class="btn-secondary" title="Zerar todos os passos marcados e nomes salvos">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
          Limpar progresso
        </button>
      </div>
    </header>

    <!-- Menu com 7 Abas rolável horizontalmente no celular -->
    <nav class="nav-tabs-wrapper">
      <div class="nav-tabs" id="navTabs" role="tablist">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </nav>

    <!-- Área de Conteúdo da Aba Ativa -->
    <main id="mainContent" class="main-content">
      <!-- Injetado dinamicamente via script.js a partir de conteudo.js -->
    </main>

    <!-- Rodapé -->
    <footer class="app-footer">
      <p>NextGen Insights &copy; Produção da Revista no Affinity</p>
    </footer>
  </div>

  <!-- Toast de notificação/confirmação de cópia -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="conteudo.js"></script>
  <script src="script.js"></script>
</body>
</html>
